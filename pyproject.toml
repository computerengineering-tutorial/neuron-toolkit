[project]
name = "neuron-toolkit"
version = "0.2.0"
description = "A unified ONNX, TFLite parsing, querying, pattern-matching, and transformation library."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sheth Jenil", email = "shethjeniljigneshbhai@gmail.com" }]

dependencies = [
    "onnx>=1.14.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "flatbuffers>=23.5.26",
    "tflite>=2.14.0",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.14.0",
]
tflite = [
    "flatbuffers>=23.5.26",
    "tflite>=2.14.0",
    "ai-edge-litert>=2.0.0",
]
eval = [
    "torch>=2.0.0",
    "onnxruntime>=1.15.0",
    "ai-edge-litert>=2.0.0",
]
all = [
    "neuron-toolkit[onnx,tflite,eval]",
]

[project.scripts]
neuron = "neuron_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"


[tool.ruff]
line-length = 88
target-version = "py311"
fix = true
show-fixes = true


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "PTH",  # pathlib usage
    "SIM",  # simplify
    "RUF",  # Ruff-specific rules
    "N",    # pep8-naming
    "S",    # bandit
    "ANN",  # type annotations
    "BLE",  # blind except
    "FBT",  # boolean trap
    "DTZ",  # datetime timezone
    "T10",  # debugger
    "EM",   # error messages
    "ISC",  # implicit string concat
    "ICN",  # import conventions
    "PT",   # pytest style
    "RET",  # return statements
    "SLF",  # private member access
    "TID",  # tidy imports
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "PERF", # performance
    "FURB", # refurb
    "LOG",  # logging
]

ignore = [
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D103",
    "PLR2004",
    "N802",
    "PLC0415",
    "PLR0915",
    "E501",
    "BLE001",
    "PLR0912",
    "N806",
    "D102",
    "SLF001",
    "D107",    # Missing docstring in __init__
    "D203",    # Conflicts with D211
    "D213",    # Conflicts with D212
    "PLR0913", # Too many arguments
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["neuron_toolkit"]


[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # assert
    "ANN",  # annotations
    "PTH",  # pathlib in tests
    "PT",   # pytest style in legacy tests
    "E402", # importorskip module-level imports
    "B",    # bugbear in tests
    "S",    # bandit in tests
    "PERF", # perf in tests
    "D",    # docstrings in tests
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]

addopts = """
--strict-markers
--cov=src
--cov-report=term-missing
-ra
"""

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "onnxscript>=0.7.2",
    "pytest>=9.2.0",
    "pytest-benchmark>=5.3.1",
    "pytest-cov>=7.1.0",
    "torch>=2.15.0",
]
